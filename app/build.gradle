plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vloader.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vloader.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 纯系统 API，无第三方依赖：OkHttp / ExoPlayer / FFmpeg 均不需要。
